<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">Multimodal alignment and fusion pipeline</title>
  <desc id="d">Animated diagram: text and vision inputs pass through their encoders into an alignment and fusion core, then downstream reasoning and robustness evaluation, which feeds failure analysis back into fusion.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#2a2560"/>
    </pattern>
    <radialGradient id="core" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2e1f6b"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#7c6bd6"/>
    </marker>

    <path id="pT" d="M170 98 H400 C455 98 455 190 504 190"/>
    <path id="pV" d="M170 282 H400 C455 282 455 190 504 190"/>
    <path id="pO" d="M616 190 C665 190 680 118 730 118 H825 V262"/>
    <path id="pF" d="M730 262 C650 340 560 330 560 246"/>
  </defs>

  <style>
    .f { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: 'SF Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }

    .box { fill: #17143a; stroke: #6d5bd0; stroke-width: 1.3; animation: bx 4s ease-in-out infinite; }
    @keyframes bx { 0%, 100% { stroke-opacity: .45; } 50% { stroke-opacity: 1; } }

    .ln { fill: none; stroke: #4b3fa8; stroke-width: 1.5; }
    .fw { fill: none; stroke: #a78bfa; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 2 12; animation: flow 1.4s linear infinite; }
    .fb { fill: none; stroke: #f0abfc; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 5 7; opacity: .8; animation: flow 1.2s linear infinite reverse; }
    @keyframes flow { to { stroke-dashoffset: -28; } }

    .cap { font-size: 11px; letter-spacing: 3px; fill: #7f76c4; }
    .sub { font-size: 11px; fill: #8b82c7; }
    .lbl { font-size: 14px; font-weight: 600; fill: #ede9fe; }

    .tok { fill: #fbbf24; transform-box: fill-box; transform-origin: left center; animation: tok 2.4s ease-in-out infinite; }
    @keyframes tok { 0%, 100% { transform: scaleX(.55); opacity: .5; } 50% { transform: scaleX(1); opacity: 1; } }
    .px { fill: #38bdf8; animation: px 2.4s ease-in-out infinite; }
    @keyframes px { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

    .ring1 { transform-box: view-box; transform-origin: 560px 190px; animation: spin 28s linear infinite; }
    .ring2 { transform-box: view-box; transform-origin: 560px 190px; animation: spin 44s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hex { animation: hex 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes hex { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="960" height="400" rx="18" fill="#0f0c29"/>
  <rect width="960" height="400" rx="18" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="959" height="399" rx="18" fill="none" stroke="#2a2560"/>

  <g class="m cap" text-anchor="middle">
    <text x="105" y="40">INPUT</text>
    <text x="315" y="40">ENCODING</text>
    <text x="560" y="40">FUSION</text>
    <text x="825" y="40">REASONING</text>
  </g>

  <g>
    <path class="ln" d="M170 98 H230" marker-end="url(#ah)"/>
    <path class="ln" d="M170 282 H230" marker-end="url(#ah)"/>
    <path class="ln" d="M400 98 C455 98 455 190 500 190" marker-end="url(#ah)"/>
    <path class="ln" d="M400 282 C455 282 455 190 500 190" marker-end="url(#ah)"/>
    <path class="ln" d="M620 190 C665 190 680 118 726 118" marker-end="url(#ah)"/>
    <path class="ln" d="M825 146 V230" marker-end="url(#ah)"/>
    <path class="ln" stroke-dasharray="2 5" d="M730 262 C650 340 560 330 560 246" marker-end="url(#ah)"/>
  </g>
  <use xlink:href="#pT" class="fw"/>
  <use xlink:href="#pV" class="fw"/>
  <use xlink:href="#pO" class="fw"/>
  <use xlink:href="#pF" class="fb"/>

  <rect class="box" x="40" y="70" width="130" height="56" rx="14"/>
  <rect class="tok" x="54" y="83" width="34" height="6" rx="3" style="animation-delay:0s"/>
  <rect class="tok" x="54" y="94" width="26" height="6" rx="3" style="animation-delay:-.8s"/>
  <rect class="tok" x="54" y="105" width="38" height="6" rx="3" style="animation-delay:-1.6s"/>
  <text class="f lbl" x="106" y="103">Text</text>

  <rect class="box" x="40" y="254" width="130" height="56" rx="14" style="animation-delay:-1s"/>
  <g>
    <rect class="px" x="54" y="268" width="9" height="9" rx="2" style="animation-delay:0s"/>
    <rect class="px" x="66" y="268" width="9" height="9" rx="2" style="animation-delay:-.4s"/>
    <rect class="px" x="78" y="268" width="9" height="9" rx="2" style="animation-delay:-.8s"/>
    <rect class="px" x="54" y="280" width="9" height="9" rx="2" style="animation-delay:-1.2s"/>
    <rect class="px" x="66" y="280" width="9" height="9" rx="2" style="animation-delay:-1.6s"/>
    <rect class="px" x="78" y="280" width="9" height="9" rx="2" style="animation-delay:-2s"/>
    <rect class="px" x="54" y="292" width="9" height="9" rx="2" style="animation-delay:-.6s"/>
    <rect class="px" x="66" y="292" width="9" height="9" rx="2" style="animation-delay:-1s"/>
    <rect class="px" x="78" y="292" width="9" height="9" rx="2" style="animation-delay:-1.8s"/>
  </g>
  <text class="f lbl" x="100" y="287">Vision</text>

  <rect class="box" x="230" y="70" width="170" height="56" rx="14" style="animation-delay:-2s"/>
  <text class="f lbl" x="315" y="103" text-anchor="middle">Language Encoder</text>
  <text class="m sub" x="315" y="146" text-anchor="middle">tokens → embeddings</text>

  <rect class="box" x="230" y="254" width="170" height="56" rx="14" style="animation-delay:-3s"/>
  <text class="f lbl" x="315" y="287" text-anchor="middle">Visual Encoder</text>
  <text class="m sub" x="315" y="330" text-anchor="middle">patches → embeddings</text>

  <circle cx="560" cy="190" r="72" fill="#7c3aed" opacity=".25">
    <animate attributeName="r" values="66;98;66" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;0;.35" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle class="ring1" cx="560" cy="190" r="84" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3 9" opacity=".8"/>
  <circle class="ring2" cx="560" cy="190" r="97" fill="none" stroke="#6d5bd0" stroke-width="1.2" stroke-dasharray="16 12" opacity=".6"/>
  <polygon class="hex" points="616,190 588,238.5 532,238.5 504,190 532,141.5 588,141.5" fill="url(#core)" stroke="#c4b5fd" stroke-width="1.6" filter="url(#glow)"/>
  <text class="f" x="560" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Alignment</text>
  <text class="f" x="560" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#e9d5ff">&amp; Fusion</text>

  <rect class="box" x="730" y="90" width="190" height="56" rx="14" style="animation-delay:-1.5s"/>
  <text class="f lbl" x="825" y="123" text-anchor="middle">Downstream Reasoning</text>

  <rect class="box" x="730" y="234" width="190" height="56" rx="14" style="animation-delay:-2.5s"/>
  <text class="f lbl" x="825" y="267" text-anchor="middle">Robustness Evaluation</text>

  <text class="m sub" x="640" y="352" text-anchor="middle" fill="#f0abfc" style="fill:#f0abfc">failure analysis</text>

  <circle r="5.5" fill="#fbbf24" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"><mpath xlink:href="#pT"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.45;.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5.5" fill="#38bdf8" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.5;1" calcMode="linear"><mpath xlink:href="#pV"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.45;.5;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="#f0abfc" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;.5;1" calcMode="linear"><mpath xlink:href="#pO"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.5;.55;.95;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
